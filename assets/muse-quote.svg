<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="150" viewBox="0 0 1400 150" role="img" aria-labelledby="title">
  <title id="title">当凛冬越过英吉利海峡进入伦敦时，我的爱会带着洋桔梗来见你 God chose u to be my Muse.</title>
  <defs>
    <linearGradient id="chinese" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d4bca" />
      <stop offset="28%" stop-color="#b43b9a" />
      <stop offset="58%" stop-color="#ca5a50" />
      <stop offset="80%" stop-color="#a97520" />
      <stop offset="100%" stop-color="#238e9b" />
    </linearGradient>
    <linearGradient id="english" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238e9b" />
      <stop offset="28%" stop-color="#2d69bb" />
      <stop offset="58%" stop-color="#6d4bca" />
      <stop offset="82%" stop-color="#b43b9a" />
      <stop offset="100%" stop-color="#ca5a50" />
    </linearGradient>
  </defs>
  <text x="700" y="60" text-anchor="middle" fill="url(#chinese)" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="43" font-weight="600">当凛冬越过英吉利海峡进入伦敦时，我的爱会带着洋桔梗来见你</text>
  <text x="700" y="123" text-anchor="middle" fill="url(#english)" font-family="Georgia, Times New Roman, serif" font-size="43" font-style="italic">God chose u to be my Muse.</text>
</svg>
